<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join GameShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Create Account</h1>
        <p>Join the community and start recharging</p>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="regUser" placeholder="Gamer123">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="email@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="••••••••">
        </div>
        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="••••••••">
        </div>
        <button onclick="register()">Register Now</button>
        <p style="margin-top: 20px;">Already have an account? <a href="/login" style="color: #38bdf8;">Login</a></p>
        <p id="error" style="color: #ff4d4d; margin-top: 10px;"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
