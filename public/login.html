<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | GameShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Login</h1>
        <p>Login to start topping up!</p>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <button onclick="login()">Login</button>
        <p style="margin-top: 20px;">Don't have an account? <a href="/register" style="color: #38bdf8;">Register here</a></p>
        <p id="error" style="color: #ff4d4d; margin-top: 10px;"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
