<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | GameShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Login</h1>
        <p>Login to start topping up!</p>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Try: admin">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Try: 12345">
        </div>
        <button onclick="login()">Login</button>
        <p id="error" style="color: #ff4d4d; margin-top: 10px;"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
